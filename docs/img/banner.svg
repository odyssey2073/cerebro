<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1207"/>
      <stop offset="1" stop-color="#2b1a08"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8c1a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>

  <!-- stylized brain -->
  <g transform="translate(70,55)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
    <path d="M55 10 C30 10 15 28 15 50 C15 60 18 68 24 75 C18 82 15 90 15 100 C15 122 30 140 55 140"/>
    <path d="M55 10 C80 10 95 28 95 50 C95 60 92 68 86 75 C92 82 95 90 95 100 C95 122 80 140 55 140"/>
    <path d="M55 10 L55 140" stroke-dasharray="2 10"/>
    <path d="M30 45 Q45 55 40 75"/>
    <path d="M80 45 Q65 55 70 75"/>
    <path d="M30 105 Q45 95 40 78" opacity="0.7"/>
    <path d="M80 105 Q65 95 70 78" opacity="0.7"/>
  </g>

  <!-- title -->
  <text x="200" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="10" fill="url(#accent)">CEREBRO</text>

  <!-- tagline -->
  <text x="204" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#d9c9b0">the external brain for your projects — multi-project RAG, 100% local</text>

  <!-- stack chips -->
  <g font-family="Consolas, monospace" font-size="15" fill="#ff8c1a">
    <rect x="620" y="40" width="110" height="30" rx="15" fill="none" stroke="#ff8c1a" stroke-width="1.5"/>
    <text x="675" y="60" text-anchor="middle">Qdrant</text>
    <rect x="745" y="40" width="110" height="30" rx="15" fill="none" stroke="#ff8c1a" stroke-width="1.5"/>
    <text x="800" y="60" text-anchor="middle">Ollama</text>
    <rect x="682" y="80" width="110" height="30" rx="15" fill="none" stroke="#ff8c1a" stroke-width="1.5"/>
    <text x="737" y="100" text-anchor="middle">Python</text>
  </g>
</svg>
